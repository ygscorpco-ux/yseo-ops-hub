name: YSEO Ops Schedule

on:
  schedule:
    - cron: "17 * * * *"
    - cron: "20 0,12 * * *"
    - cron: "0 0 * * *"
    - cron: "10 1 28-31 * *"
  workflow_dispatch:
    inputs:
      target:
        description: Which task to trigger
        required: true
        default: all
        type: choice
        options:
          - all
          - naver-hourly
          - search-console-daily
          - daily-alerts
          - month-end-reports

jobs:
  naver-hourly:
    if: >-
      github.event_name == 'schedule' && github.event.schedule == '17 * * * *' ||
      github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'naver-hourly')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger NAVER sync
        env:
          YSEO_BASE_URL: ${{ vars.YSEO_BASE_URL }}
          YSEO_CRON_SECRET: ${{ secrets.YSEO_CRON_SECRET }}
        run: |
          BASE_URL="${YSEO_BASE_URL:-https://yseo.vercel.app}"
          curl --fail --show-error --silent \
            -H "Authorization: Bearer ${YSEO_CRON_SECRET}" \
            "${BASE_URL}/api/cron/naver-hourly"

  search-console-daily:
    if: >-
      github.event_name == 'schedule' && github.event.schedule == '20 0,12 * * *' ||
      github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'search-console-daily')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Search Console sync
        env:
          YSEO_BASE_URL: ${{ vars.YSEO_BASE_URL }}
          YSEO_CRON_SECRET: ${{ secrets.YSEO_CRON_SECRET }}
        run: |
          BASE_URL="${YSEO_BASE_URL:-https://yseo.vercel.app}"
          curl --fail --show-error --silent \
            -H "Authorization: Bearer ${YSEO_CRON_SECRET}" \
            "${BASE_URL}/api/cron/search-console-daily"

  daily-alerts:
    if: >-
      github.event_name == 'schedule' && github.event.schedule == '0 0 * * *' ||
      github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'daily-alerts')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily alert summary
        env:
          YSEO_BASE_URL: ${{ vars.YSEO_BASE_URL }}
          YSEO_CRON_SECRET: ${{ secrets.YSEO_CRON_SECRET }}
        run: |
          BASE_URL="${YSEO_BASE_URL:-https://yseo.vercel.app}"
          curl --fail --show-error --silent \
            -H "Authorization: Bearer ${YSEO_CRON_SECRET}" \
            "${BASE_URL}/api/cron/daily-alerts"

  month-end-reports:
    if: >-
      github.event_name == 'schedule' && github.event.schedule == '10 1 28-31 * *' ||
      github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'month-end-reports')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger month-end report batch
        env:
          YSEO_BASE_URL: ${{ vars.YSEO_BASE_URL }}
          YSEO_CRON_SECRET: ${{ secrets.YSEO_CRON_SECRET }}
        run: |
          BASE_URL="${YSEO_BASE_URL:-https://yseo.vercel.app}"
          curl --fail --show-error --silent \
            -H "Authorization: Bearer ${YSEO_CRON_SECRET}" \
            "${BASE_URL}/api/cron/month-end-reports"
